    <title>Astroingeniería — Museo Orbital</title>
    <style>
      /* Pantalla de arranque: un punto de luz que existe antes de que cargue
         el JS. La intro del hero lo reemplaza en el mismo lugar; si algo
         falla, se desvanece sola a los 10 s. */
      #mo-boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #070707;
        pointer-events: none;
        animation: mo-boot-failsafe 0.6s ease 10s forwards;
      }
      #mo-boot i {
        position: absolute;
        left: 50%;
        top: calc((100vh - 46px) * 0.4675);
        width: 6px;
        height: 6px;
        margin: -3px 0 0 -3px;
        border-radius: 50%;
        background: #fff1e0;
        box-shadow:
          0 0 8px 2px rgba(255, 196, 150, 0.9),
          0 0 26px 8px rgba(255, 110, 60, 0.45),
          0 0 60px 22px rgba(255, 70, 30, 0.16);
        animation: mo-boot-pulse 1.8s ease-in-out infinite;
      }
      @keyframes mo-boot-pulse {
        50% { transform: scale(1.35); opacity: 0.75; }
      }
      @keyframes mo-boot-failsafe {
        to { opacity: 0; visibility: hidden; }
      }
      @media (prefers-reduced-motion: reduce) {
        #mo-boot i { animation: none; }
      }
    </style>
