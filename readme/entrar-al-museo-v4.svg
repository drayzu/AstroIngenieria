<svg xmlns="http://www.w3.org/2000/svg" width="830" height="400" viewBox="0 0 830 400" role="img" aria-label="AstroIngenier&#237;a">
  <title>AstroIngenier&#237;a</title>
  <defs>
    <linearGradient id="meteor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f1e8" stop-opacity="0"/>
      <stop offset="0.75" stop-color="#f5f1e8" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#fff8ea"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <clipPath id="clip"><rect x="0" y="0" width="830" height="400"/></clipPath>
  </defs>

  <!-- fondo exacto al dark de GitHub -->
  <rect width="830" height="400" fill="#0d1117"/>

  <g clip-path="url(#clip)">
    <!-- deriva parallax lenta -->
    <g fill="#f5f1e8" opacity="0.15">
      <animateTransform attributeName="transform" type="translate" values="0 0; -830 0" dur="100s" repeatCount="indefinite"/>
      <circle cx="60" cy="30" r="0.9"/><circle cx="890" cy="30" r="0.9"/>
      <circle cx="210" cy="90" r="0.7"/><circle cx="1040" cy="90" r="0.7"/>
      <circle cx="340" cy="150" r="0.8"/><circle cx="1170" cy="150" r="0.8"/>
      <circle cx="520" cy="60" r="0.7"/><circle cx="1350" cy="60" r="0.7"/>
      <circle cx="700" cy="110" r="0.9"/><circle cx="1530" cy="110" r="0.9"/>
      <circle cx="90" cy="210" r="0.7"/><circle cx="920" cy="210" r="0.7"/>
      <circle cx="430" cy="180" r="0.8"/><circle cx="1260" cy="180" r="0.8"/>
      <circle cx="770" cy="250" r="0.8"/><circle cx="1600" cy="250" r="0.8"/>
      <circle cx="160" cy="290" r="0.7"/><circle cx="990" cy="290" r="0.7"/>
      <circle cx="580" cy="330" r="0.8"/><circle cx="1410" cy="330" r="0.8"/>
      <circle cx="280" cy="360" r="0.6"/><circle cx="1110" cy="360" r="0.6"/>
      <circle cx="730" cy="380" r="0.7"/><circle cx="1560" cy="380" r="0.7"/>
      <circle cx="30" cy="120" r="0.6"/><circle cx="860" cy="120" r="0.6"/>
      <circle cx="650" cy="200" r="0.7"/><circle cx="1480" cy="200" r="0.7"/>
      <circle cx="120" cy="330" r="0.6"/><circle cx="950" cy="330" r="0.6"/>
      <circle cx="500" cy="300" r="0.7"/><circle cx="1330" cy="300" r="0.7"/>
    </g>
    <!-- deriva parallax rapida, dorada -->
    <g fill="#e8c987" opacity="0.12">
      <animateTransform attributeName="transform" type="translate" values="-830 0; 0 0" dur="70s" repeatCount="indefinite"/>
      <circle cx="130" cy="50" r="0.8"/><circle cx="960" cy="50" r="0.8"/>
      <circle cx="370" cy="130" r="0.6"/><circle cx="1200" cy="130" r="0.6"/>
      <circle cx="610" cy="170" r="0.9"/><circle cx="1440" cy="170" r="0.9"/>
      <circle cx="250" cy="240" r="0.6"/><circle cx="1080" cy="240" r="0.6"/>
      <circle cx="490" cy="300" r="0.7"/><circle cx="1320" cy="300" r="0.7"/>
      <circle cx="730" cy="90" r="0.6"/><circle cx="1560" cy="90" r="0.6"/>
      <circle cx="60" cy="280" r="0.7"/><circle cx="890" cy="280" r="0.7"/>
      <circle cx="330" cy="350" r="0.8"/><circle cx="1160" cy="350" r="0.8"/>
      <circle cx="560" cy="20" r="0.7"/><circle cx="1390" cy="20" r="0.7"/>
      <circle cx="760" cy="320" r="0.6"/><circle cx="1590" cy="320" r="0.6"/>
    </g>

    <!-- orbita difusa tras el bloque de texto -->
    <g fill="none" transform="translate(415 230)">
      <ellipse rx="360" ry="70" stroke="#c9a86a" stroke-opacity="0.05" transform="rotate(-5)"/>
      <circle r="1.3" fill="#e8c987" opacity="0.5" transform="rotate(-5)">
        <animateMotion dur="38s" repeatCount="indefinite" path="M -360 0 A 360 70 0 1 0 360 0 A 360 70 0 1 0 -360 0"/>
      </circle>
    </g>

    <!-- titilantes en margenes -->
    <g fill="#f5f1e8">
      <circle cx="5" cy="40" r="1" opacity="0.35"><animate attributeName="opacity" values="0.12;0.6;0.12" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="11" cy="120" r="0.8" opacity="0.3"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="4" cy="200" r="0.9" opacity="0.3"><animate attributeName="opacity" values="0.2;0.65;0.2" dur="3.8s" repeatCount="indefinite"/></circle>
      <circle cx="12" cy="280" r="1" opacity="0.35"><animate attributeName="opacity" values="0.55;0.15;0.55" dur="2.9s" repeatCount="indefinite"/></circle>
      <circle cx="7" cy="350" r="0.9" opacity="0.3"><animate attributeName="opacity" values="0.15;0.6;0.15" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="824" cy="60" r="1" opacity="0.35"><animate attributeName="opacity" values="0.45;0.12;0.45" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="818" cy="140" r="0.9" opacity="0.3"><animate attributeName="opacity" values="0.15;0.6;0.15" dur="2.7s" repeatCount="indefinite"/></circle>
      <circle cx="825" cy="220" r="1" opacity="0.35"><animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.9s" repeatCount="indefinite"/></circle>
      <circle cx="819" cy="300" r="0.8" opacity="0.3"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="3.3s" repeatCount="indefinite"/></circle>
      <circle cx="823" cy="370" r="0.9" opacity="0.3"><animate attributeName="opacity" values="0.5;0.12;0.5" dur="2.5s" repeatCount="indefinite"/></circle>
    </g>

    <!-- titilantes en los huecos entre parrafos -->
    <g fill="#f5f1e8">
      <circle cx="100" cy="72" r="0.8" opacity="0.3"><animate attributeName="opacity" values="0.1;0.45;0.1" dur="3.3s" repeatCount="indefinite"/></circle>
      <circle cx="300" cy="76" r="0.9" opacity="0.3"><animate attributeName="opacity" values="0.4;0.1;0.4" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="520" cy="70" r="0.8" opacity="0.3"><animate attributeName="opacity" values="0.12;0.5;0.12" dur="3.7s" repeatCount="indefinite"/></circle>
      <circle cx="700" cy="74" r="0.9" opacity="0.3"><animate attributeName="opacity" values="0.4;0.12;0.4" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="200" cy="112" r="0.8" opacity="0.3"><animate attributeName="opacity" values="0.1;0.45;0.1" dur="3.5s" repeatCount="indefinite"/></circle>
      <circle cx="450" cy="116" r="0.9" opacity="0.3"><animate attributeName="opacity" values="0.4;0.1;0.4" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="680" cy="110" r="0.8" opacity="0.3"><animate attributeName="opacity" values="0.12;0.5;0.12" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="80" cy="152" r="0.9" opacity="0.3"><animate attributeName="opacity" values="0.4;0.12;0.4" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="350" cy="156" r="0.8" opacity="0.3"><animate attributeName="opacity" values="0.1;0.45;0.1" dur="2.9s" repeatCount="indefinite"/></circle>
      <circle cx="600" cy="150" r="0.9" opacity="0.3"><animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.8s" repeatCount="indefinite"/></circle>
      <circle cx="150" cy="192" r="0.8" opacity="0.3"><animate attributeName="opacity" values="0.12;0.5;0.12" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="400" cy="196" r="0.9" opacity="0.3"><animate attributeName="opacity" values="0.4;0.12;0.4" dur="2.7s" repeatCount="indefinite"/></circle>
      <circle cx="650" cy="190" r="0.8" opacity="0.3"><animate attributeName="opacity" values="0.1;0.45;0.1" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="100" cy="232" r="0.9" opacity="0.3"><animate attributeName="opacity" values="0.4;0.1;0.4" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="320" cy="236" r="0.8" opacity="0.3"><animate attributeName="opacity" values="0.12;0.5;0.12" dur="3.7s" repeatCount="indefinite"/></circle>
      <circle cx="560" cy="230" r="0.9" opacity="0.3"><animate attributeName="opacity" values="0.4;0.1;0.4" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="180" cy="272" r="0.8" opacity="0.3"><animate attributeName="opacity" values="0.1;0.45;0.1" dur="3.3s" repeatCount="indefinite"/></circle>
      <circle cx="430" cy="276" r="0.9" opacity="0.3"><animate attributeName="opacity" values="0.4;0.12;0.4" dur="3.5s" repeatCount="indefinite"/></circle>
      <circle cx="690" cy="270" r="0.8" opacity="0.3"><animate attributeName="opacity" values="0.12;0.5;0.12" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="540" cy="98" r="0.8" opacity="0.3"><animate attributeName="opacity" values="0.1;0.5;0.1" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="640" cy="138" r="0.9" opacity="0.3"><animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="580" cy="178" r="0.8" opacity="0.3"><animate attributeName="opacity" values="0.12;0.5;0.12" dur="2.5s" repeatCount="indefinite"/></circle>
      <circle cx="700" cy="218" r="0.9" opacity="0.3"><animate attributeName="opacity" values="0.4;0.12;0.4" dur="3.8s" repeatCount="indefinite"/></circle>
      <circle cx="520" cy="258" r="0.8" opacity="0.3"><animate attributeName="opacity" values="0.1;0.5;0.1" dur="3s" repeatCount="indefinite"/></circle>
    </g>
    <g fill="#c9a86a">
      <circle cx="600" cy="112" r="1" opacity="0.5"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="90" cy="192" r="0.9" opacity="0.5"><animate attributeName="opacity" values="0.25;0.75;0.25" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="720" cy="232" r="1" opacity="0.5"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="3.8s" repeatCount="indefinite"/></circle>
      <circle cx="480" cy="272" r="0.9" opacity="0.5"><animate attributeName="opacity" values="0.25;0.75;0.25" dur="2.8s" repeatCount="indefinite"/></circle>
    </g>

    <!-- meteoro ocasional -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.05;0.12;1" dur="9.5s" repeatCount="indefinite"/>
      <g transform="rotate(32)">
        <line x1="-140" y1="-44" x2="-50" y2="-16" stroke="url(#meteor)" stroke-width="1.4" stroke-linecap="round"/>
        <circle cx="-48" cy="-15" r="3" fill="#e8c987" opacity="0.65" filter="url(#soft)"/>
        <circle cx="-48" cy="-15" r="1.5" fill="#fff8ea"/>
        <animateTransform attributeName="transform" type="translate" additive="sum" values="-40 -30; 1080 420; 1080 420" keyTimes="0;0.12;1" dur="9.5s" repeatCount="indefinite"/>
      </g>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.04;0.1;1" dur="14s" begin="6.5s" repeatCount="indefinite"/>
      <g transform="rotate(150)">
        <line x1="-130" y1="-40" x2="-50" y2="-15" stroke="url(#meteor)" stroke-width="1.2" stroke-linecap="round"/>
        <circle cx="-48" cy="-14" r="2.8" fill="#e8c987" opacity="0.6" filter="url(#soft)"/>
        <circle cx="-48" cy="-14" r="1.4" fill="#fff8ea"/>
        <animateTransform attributeName="transform" type="translate" additive="sum" values="920 -50; -200 440; -200 440" keyTimes="0;0.1;1" dur="14s" begin="6.5s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- motas ascendentes en margenes -->
    <g>
      <circle cx="8" cy="420" r="1" fill="#e8c987" opacity="0">
        <animate attributeName="opacity" values="0;0.5;0.5;0" keyTimes="0;0.15;0.8;1" dur="24s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0; -4 -450" dur="24s" repeatCount="indefinite"/>
      </circle>
      <circle cx="822" cy="420" r="0.9" fill="#f5f1e8" opacity="0">
        <animate attributeName="opacity" values="0;0.4;0.4;0" keyTimes="0;0.15;0.8;1" dur="28s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0; 4 -450" dur="28s" repeatCount="indefinite"/>
      </circle>
      <circle cx="16" cy="420" r="1.1" fill="#e8c987" opacity="0">
        <animate attributeName="opacity" values="0;0.5;0.5;0" keyTimes="0;0.15;0.8;1" dur="21s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0; -3 -455" dur="21s" repeatCount="indefinite"/>
      </circle>
      <circle cx="814" cy="420" r="0.8" fill="#f5f1e8" opacity="0">
        <animate attributeName="opacity" values="0;0.4;0.4;0" keyTimes="0;0.15;0.8;1" dur="26s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0; 3 -445" dur="26s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- cuerpo de texto: imita el README de GitHub -->
    <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="16" fill="#e6edf3" xml:space="preserve">
      <text><tspan x="2" y="34">Durante casi toda nuestra historia, mirar hacia arriba signific&#243; observar algo fuera de</tspan><tspan x="2" dy="24">nuestro alcance.</tspan></text>
      <text><tspan x="2" y="98">El cielo era distancia.</tspan></text>
      <text><tspan x="2" y="138">Despu&#233;s se convirti&#243; en destino.</tspan></text>
      <text><tspan x="2" y="178">Quiz&#225; alg&#250;n d&#237;a se convierta en nuestra obra.</tspan></text>
      <text><tspan x="2" y="218">AstroIngenier&#237;a explora lo que viene despu&#233;s de alcanzar las estrellas.</tspan></text>
      <text><tspan x="2" y="258">106 conceptos &#183; 9 salas &#183; un horizonte a&#250;n vac&#237;o</tspan></text>
      <text><tspan x="2" y="298">La naturaleza necesit&#243; miles de millones de a&#241;os para engendrar una mente capaz de</tspan><tspan x="2" dy="24">comprenderla. Bast&#243; una fracci&#243;n de ese tiempo para que aquella mente aprendiera a crear</tspan><tspan x="2" dy="24">otras. Y as&#237;, de un universo que nunca supo hacia d&#243;nde iba, naci&#243; algo capaz de elegir</tspan><tspan x="2" dy="24">hacia d&#243;nde ir&#225;.</tspan></text>
    </g>
  </g>
</svg>
