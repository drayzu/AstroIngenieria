<svg xmlns="http://www.w3.org/2000/svg" width="780" height="640" viewBox="0 0 780 640" role="img" aria-label="AstroIngenier&#237;a &#8212; lo que viene despu&#233;s de alcanzar las estrellas">
  <title>AstroIngenier&#237;a</title>
  <defs>
    <linearGradient id="tgrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf7e7"/>
      <stop offset="0.55" stop-color="#efdcab"/>
      <stop offset="1" stop-color="#cfa964"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9a86a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#c9a86a" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#c9a86a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="meteor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f1e8" stop-opacity="0"/>
      <stop offset="0.75" stop-color="#f5f1e8" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#fff8ea"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="foil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff8ea" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff8ea" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#fff8ea" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8c987" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#e8c987" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <clipPath id="clip"><rect x="0" y="0" width="780" height="640"/></clipPath>
    <clipPath id="sclip">
      <text x="390" y="340" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="21" font-weight="700">AstroIngenier&#237;a explora lo que viene</text>
      <text x="390" y="372" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="21" font-weight="700">despu&#233;s de alcanzar las estrellas.</text>
    </clipPath>
  </defs>

  <!-- fondo exacto al dark de GitHub -->
  <rect width="780" height="640" fill="#0d1117"/>

  <g clip-path="url(#clip)">
    <!-- deriva parallax lenta -->
    <g fill="#f5f1e8" opacity="0.17">
      <animateTransform attributeName="transform" type="translate" values="0 0; -780 0" dur="105s" repeatCount="indefinite"/>
      <circle cx="60" cy="50" r="0.9"/><circle cx="840" cy="50" r="0.9"/>
      <circle cx="210" cy="140" r="0.7"/><circle cx="990" cy="140" r="0.7"/>
      <circle cx="340" cy="240" r="0.8"/><circle cx="1120" cy="240" r="0.8"/>
      <circle cx="520" cy="90" r="0.7"/><circle cx="1300" cy="90" r="0.7"/>
      <circle cx="700" cy="180" r="0.9"/><circle cx="1480" cy="180" r="0.9"/>
      <circle cx="90" cy="320" r="0.7"/><circle cx="870" cy="320" r="0.7"/>
      <circle cx="430" cy="440" r="0.8"/><circle cx="1210" cy="440" r="0.8"/>
      <circle cx="720" cy="500" r="0.8"/><circle cx="1500" cy="500" r="0.8"/>
      <circle cx="160" cy="560" r="0.7"/><circle cx="940" cy="560" r="0.7"/>
      <circle cx="580" cy="610" r="0.8"/><circle cx="1360" cy="610" r="0.8"/>
      <circle cx="280" cy="40" r="0.6"/><circle cx="1060" cy="40" r="0.6"/>
      <circle cx="640" cy="380" r="0.7"/><circle cx="1420" cy="380" r="0.7"/>
      <circle cx="30" cy="180" r="0.6"/><circle cx="810" cy="180" r="0.6"/>
      <circle cx="140" cy="480" r="0.7"/><circle cx="920" cy="480" r="0.7"/>
      <circle cx="660" cy="30" r="0.7"/><circle cx="1440" cy="30" r="0.7"/>
    </g>
    <!-- deriva parallax rapida, dorada -->
    <g fill="#e8c987" opacity="0.14">
      <animateTransform attributeName="transform" type="translate" values="-780 0; 0 0" dur="72s" repeatCount="indefinite"/>
      <circle cx="130" cy="90" r="0.8"/><circle cx="910" cy="90" r="0.8"/>
      <circle cx="370" cy="200" r="0.6"/><circle cx="1150" cy="200" r="0.6"/>
      <circle cx="610" cy="300" r="0.9"/><circle cx="1390" cy="300" r="0.9"/>
      <circle cx="250" cy="380" r="0.6"/><circle cx="1030" cy="380" r="0.6"/>
      <circle cx="490" cy="540" r="0.7"/><circle cx="1270" cy="540" r="0.7"/>
      <circle cx="730" cy="120" r="0.6"/><circle cx="1510" cy="120" r="0.6"/>
      <circle cx="60" cy="420" r="0.7"/><circle cx="840" cy="420" r="0.7"/>
      <circle cx="330" cy="600" r="0.8"/><circle cx="1110" cy="600" r="0.8"/>
      <circle cx="560" cy="50" r="0.7"/><circle cx="1340" cy="50" r="0.7"/>
      <circle cx="700" cy="570" r="0.6"/><circle cx="1480" cy="570" r="0.6"/>
    </g>

    <!-- resplandor tras el statement -->
    <ellipse cx="390" cy="356" rx="280" ry="58" fill="url(#glow)">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="5.6s" repeatCount="indefinite"/>
    </ellipse>

    <!-- orbita eliptica tras el statement -->
    <g fill="none" transform="translate(390 356)">
      <ellipse rx="300" ry="60" stroke="#c9a86a" stroke-opacity="0.09" transform="rotate(-5)"/>
      <ellipse rx="350" ry="78" stroke="#f5f1e8" stroke-opacity="0.045" transform="rotate(-5)"/>
      <g transform="rotate(-5)">
        <circle r="1.6" fill="#e8c987" opacity="0.6">
          <animateMotion dur="30s" repeatCount="indefinite" path="M -350 0 A 350 78 0 1 0 350 0 A 350 78 0 1 0 -350 0"/>
        </circle>
        <circle r="1" fill="#f5f1e8" opacity="0.45">
          <animateMotion dur="44s" repeatCount="indefinite" path="M -300 0 A 300 60 0 1 1 300 0 A 300 60 0 1 1 -300 0"/>
        </circle>
      </g>
    </g>

    <!-- cielo fijo: laterales, arriba y abajo -->
    <g fill="#f5f1e8">
      <circle cx="30" cy="60" r="1" opacity="0.35"><animate attributeName="opacity" values="0.12;0.6;0.12" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="90" cy="120" r="0.8" opacity="0.3"><animate attributeName="opacity" values="0.5;0.12;0.5" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="50" cy="200" r="0.9" opacity="0.3"><animate attributeName="opacity" values="0.2;0.65;0.2" dur="3.9s" repeatCount="indefinite"/></circle>
      <circle cx="120" cy="260" r="1" opacity="0.35"><animate attributeName="opacity" values="0.55;0.15;0.55" dur="2.9s" repeatCount="indefinite"/></circle>
      <circle cx="70" cy="330" r="0.9" opacity="0.3"><animate attributeName="opacity" values="0.15;0.6;0.15" dur="3.7s" repeatCount="indefinite"/></circle>
      <circle cx="140" cy="400" r="0.8" opacity="0.3"><animate attributeName="opacity" values="0.45;0.12;0.45" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="40" cy="470" r="0.9" opacity="0.3"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="3.5s" repeatCount="indefinite"/></circle>
      <circle cx="100" cy="540" r="1" opacity="0.35"><animate attributeName="opacity" values="0.5;0.15;0.5" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="60" cy="600" r="0.9" opacity="0.3"><animate attributeName="opacity" values="0.15;0.6;0.15" dur="3.3s" repeatCount="indefinite"/></circle>
      <circle cx="750" cy="80" r="1" opacity="0.35"><animate attributeName="opacity" values="0.45;0.12;0.45" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="690" cy="150" r="0.9" opacity="0.3"><animate attributeName="opacity" values="0.15;0.6;0.15" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="730" cy="230" r="1" opacity="0.35"><animate attributeName="opacity" values="0.5;0.15;0.5" dur="2.7s" repeatCount="indefinite"/></circle>
      <circle cx="660" cy="300" r="0.9" opacity="0.3"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="3.8s" repeatCount="indefinite"/></circle>
      <circle cx="710" cy="370" r="1" opacity="0.35"><animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="750" cy="440" r="0.8" opacity="0.3"><animate attributeName="opacity" values="0.15;0.6;0.15" dur="3.9s" repeatCount="indefinite"/></circle>
      <circle cx="680" cy="510" r="0.9" opacity="0.3"><animate attributeName="opacity" values="0.45;0.12;0.45" dur="2.9s" repeatCount="indefinite"/></circle>
      <circle cx="730" cy="580" r="1" opacity="0.35"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="200" cy="30" r="0.9" opacity="0.3"><animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="390" cy="20" r="1" opacity="0.35"><animate attributeName="opacity" values="0.15;0.65;0.15" dur="3.7s" repeatCount="indefinite"/></circle>
      <circle cx="560" cy="35" r="0.8" opacity="0.3"><animate attributeName="opacity" values="0.5;0.15;0.5" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="250" cy="622" r="0.9" opacity="0.3"><animate attributeName="opacity" values="0.2;0.65;0.2" dur="3.5s" repeatCount="indefinite"/></circle>
      <circle cx="450" cy="618" r="1" opacity="0.3"><animate attributeName="opacity" values="0.5;0.12;0.5" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="600" cy="612" r="0.8" opacity="0.3"><animate attributeName="opacity" values="0.15;0.6;0.15" dur="3.8s" repeatCount="indefinite"/></circle>
    </g>
    <g fill="#c9a86a">
      <circle cx="160" cy="160" r="1" opacity="0.5"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="640" cy="200" r="1.1" opacity="0.55"><animate attributeName="opacity" values="0.25;0.85;0.25" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="120" cy="430" r="1" opacity="0.5"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="3.7s" repeatCount="indefinite"/></circle>
      <circle cx="700" cy="480" r="0.9" opacity="0.5"><animate attributeName="opacity" values="0.25;0.75;0.25" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="390" cy="628" r="1" opacity="0.5"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.9s" repeatCount="indefinite"/></circle>
    </g>

    <!-- ornamentos junto al triptico -->
    <g transform="translate(180 226)">
      <path d="M0 -4.6 Q0.9 -0.9 4.6 0 Q0.9 0.9 0 4.6 Q-0.9 0.9 -4.6 0 Q-0.9 -0.9 0 -4.6 Z" fill="#e8c987">
        <animate attributeName="opacity" values="0.3;0.95;0.3" dur="4.2s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="scale" values="0.8;1.08;0.8" dur="4.2s" repeatCount="indefinite"/>
      </path>
    </g>
    <g transform="translate(600 226)">
      <path d="M0 -4.6 Q0.9 -0.9 4.6 0 Q0.9 0.9 0 4.6 Q-0.9 0.9 -4.6 0 Q-0.9 -0.9 0 -4.6 Z" fill="#e8c987">
        <animate attributeName="opacity" values="0.3;0.95;0.3" dur="4.2s" begin="2.1s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="scale" values="0.8;1.08;0.8" dur="4.2s" begin="2.1s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- meteoro ocasional -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.05;0.12;1" dur="10s" repeatCount="indefinite"/>
      <g transform="rotate(33)">
        <line x1="-150" y1="-46" x2="-52" y2="-16" stroke="url(#meteor)" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="-50" cy="-15" r="3.2" fill="#e8c987" opacity="0.7" filter="url(#soft)"/>
        <circle cx="-50" cy="-15" r="1.6" fill="#fff8ea"/>
        <animateTransform attributeName="transform" type="translate" additive="sum" values="-40 -40; 1020 700; 1020 700" keyTimes="0;0.12;1" dur="10s" repeatCount="indefinite"/>
      </g>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.04;0.1;1" dur="15s" begin="7s" repeatCount="indefinite"/>
      <g transform="rotate(151)">
        <line x1="-135" y1="-42" x2="-50" y2="-15" stroke="url(#meteor)" stroke-width="1.3" stroke-linecap="round"/>
        <circle cx="-48" cy="-14" r="3" fill="#e8c987" opacity="0.65" filter="url(#soft)"/>
        <circle cx="-48" cy="-14" r="1.4" fill="#fff8ea"/>
        <animateTransform attributeName="transform" type="translate" additive="sum" values="940 -60; -220 720; -220 720" keyTimes="0;0.1;1" dur="15s" begin="7s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- motas ascendentes -->
    <g>
      <circle cx="20" cy="660" r="1" fill="#e8c987" opacity="0">
        <animate attributeName="opacity" values="0;0.5;0.5;0" keyTimes="0;0.15;0.8;1" dur="26s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0; -6 -690" dur="26s" repeatCount="indefinite"/>
      </circle>
      <circle cx="760" cy="660" r="0.9" fill="#f5f1e8" opacity="0">
        <animate attributeName="opacity" values="0;0.4;0.4;0" keyTimes="0;0.15;0.8;1" dur="30s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0; 6 -690" dur="30s" repeatCount="indefinite"/>
      </circle>
      <circle cx="40" cy="660" r="1.1" fill="#e8c987" opacity="0">
        <animate attributeName="opacity" values="0;0.5;0.5;0" keyTimes="0;0.15;0.8;1" dur="23s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0; -4 -700" dur="23s" repeatCount="indefinite"/>
      </circle>
      <circle cx="740" cy="660" r="0.8" fill="#f5f1e8" opacity="0">
        <animate attributeName="opacity" values="0;0.4;0.4;0" keyTimes="0;0.15;0.8;1" dur="28s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0; 4 -695" dur="28s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- barrido sutil de luz -->
    <rect x="-160" y="-60" width="120" height="760" fill="url(#sheen)" transform="skewX(-18)">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="-180 0; 1020 0" dur="9s" repeatCount="indefinite"/>
    </rect>

    <!-- intro -->
    <text text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="17" fill="#e6edf3" fill-opacity="0.7"><tspan x="390" y="96">Durante casi toda nuestra historia, mirar hacia arriba</tspan><tspan x="390" y="124">signific&#243; observar algo fuera de nuestro alcance.</tspan></text>

    <!-- triptico poetico con respiracion secuencial -->
    <g text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="19" fill="#f5f1e8">
      <text x="390" y="188">El cielo era distancia.<animate attributeName="opacity" values="0.6;1;0.6;0.6" keyTimes="0;0.08;0.2;1" dur="11.4s" repeatCount="indefinite"/></text>
      <text x="390" y="226">Despu&#233;s se convirti&#243; en destino.<animate attributeName="opacity" values="0.6;0.6;1;0.6" keyTimes="0;0.36;0.47;1" dur="11.4s" repeatCount="indefinite"/></text>
      <text x="390" y="264">Quiz&#225; alg&#250;n d&#237;a se convierta en nuestra obra.<animate attributeName="opacity" values="0.6;0.6;1;0.6" keyTimes="0;0.69;0.8;1" dur="11.4s" repeatCount="indefinite"/></text>
    </g>

    <!-- statement: capa glow + gradiente dorado -->
    <g text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="21" font-weight="700" fill="#d8b878" opacity="0.45" filter="url(#soft)">
      <text x="390" y="340">AstroIngenier&#237;a explora lo que viene<animate attributeName="opacity" values="0.35;0.6;0.35" dur="5.6s" repeatCount="indefinite"/></text>
      <text x="390" y="372">despu&#233;s de alcanzar las estrellas.</text>
    </g>
    <g text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="21" font-weight="700" fill="url(#tgrad)">
      <text x="390" y="340">AstroIngenier&#237;a explora lo que viene</text>
      <text x="390" y="372">despu&#233;s de alcanzar las estrellas.</text>
    </g>

    <!-- barrido foil sobre el statement -->
    <g clip-path="url(#sclip)">
      <rect x="-140" y="318" width="56" height="72" fill="url(#foil)" transform="skewX(-18)">
        <animateTransform attributeName="transform" type="translate" additive="sum" values="-60 0; 940 0" keyTimes="0;1" dur="7.5s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- regla + tagline -->
    <rect x="240" y="428" width="300" height="1" fill="url(#rule)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="4.6s" repeatCount="indefinite"/>
    </rect>
    <g transform="translate(228 428.5)">
      <path d="M0 -3.4 Q0.7 -0.7 3.4 0 Q0.7 0.7 0 3.4 Q-0.7 0.7 -3.4 0 Q-0.7 -0.7 0 -3.4 Z" fill="#c9a86a">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="4.6s" repeatCount="indefinite"/>
      </path>
    </g>
    <g transform="translate(552 428.5)">
      <path d="M0 -3.4 Q0.7 -0.7 3.4 0 Q0.7 0.7 0 3.4 Q-0.7 0.7 -3.4 0 Q-0.7 -0.7 0 -3.4 Z" fill="#c9a86a">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="4.6s" begin="2.3s" repeatCount="indefinite"/>
      </path>
    </g>
    <text x="390" y="460" text-anchor="middle" font-family="'JetBrains Mono',Consolas,Menlo,'Courier New',monospace" font-size="10" letter-spacing="3" fill="#c9a86a" fill-opacity="0.9">106 CONCEPTOS &#183; 9 SALAS &#183; UN HORIZONTE A&#218;N VAC&#205;O</text>

    <!-- parrafo final -->
    <text text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="14" fill="#a9b2bd"><tspan x="390" y="524">La naturaleza necesit&#243; miles de millones de a&#241;os para engendrar una</tspan><tspan x="390" dy="24">mente capaz de comprenderla. Bast&#243; una fracci&#243;n de ese tiempo para que</tspan><tspan x="390" dy="24">aquella mente aprendiera a crear otras. Y as&#237;, de un universo que nunca</tspan><tspan x="390" dy="24">supo hacia d&#243;nde iba, naci&#243; algo capaz de elegir hacia d&#243;nde ir&#225;.</tspan></text>
  </g>
</svg>
